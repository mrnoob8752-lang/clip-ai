
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b25">
<title>CLIP AI — Viral Clip Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b25;color:#fff;font-family:Arial,sans-serif;padding:24px 16px}
main{max-width:520px;margin:30px auto}
header{text-align:center;margin-bottom:28px}
.logo{font-size:36px;font-weight:900;color:#b99aff;letter-spacing:2px}
header p{color:#aaa;margin-top:8px}
.panel{background:#1c1535;border:1px solid #39285e;border-radius:18px;padding:22px}
h2{font-size:19px;margin:0 0 18px}
label{display:block;font-size:14px;color:#ddd;margin:18px 0 8px}
input,textarea{width:100%;padding:14px;border-radius:10px;border:1px solid #49376e;background:#100b25;color:white;font-size:15px}
input[type=file]{padding:12px}
button{width:100%;border:0;border-radius:11px;padding:16px;background:#8955ed;color:white;font-size:16px;font-weight:bold;margin-top:20px}
button:disabled{opacity:.5}
.note{font-size:12px;color:#aaa;line-height:1.6;margin-top:10px}
.status{margin-top:18px;text-align:center;line-height:1.5;color:#c9b6ff;white-space:pre-wrap}
footer{text-align:center;color:#777;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<main>
<header>
<div class="logo">CLIP AI</div>
<p>Find the best moments. Create viral clips.</p>
</header>

<section class="panel">
<h2>Choose your video</h2>

<label for="video">Upload video</label>
<input id="video" type="file" accept="video/*">

<div style="text-align:center;color:#aaa;margin:17px">— OR PASTE VIDEO LINK —</div>

<label for="url">YouTube / Instagram Reel / MP4 link</label>
<input id="url" type="url" placeholder="Paste your video link here">

<label for="focus">What moments should we find? (Optional)</label>
<textarea id="focus" rows="3" placeholder="Funny moments, highlights, important points..."></textarea>

<button id="start">Find Viral Clips</button>
<div class="note">Maximum upload: 50 MB. Video duration: up to 180 seconds. Only publicly accessible links are supported. Private or login-required videos may not work.</div>
<div class="status" id="status"></div>
</section>

<footer>CLIP AI · AI-powered video highlights</footer>
</main>

<script>
const API="https://clip-ai-backend-jw5v.onrender.com/api/clip";
const video=document.getElementById("video");
const url=document.getElementById("url");
const focus=document.getElementById("focus");
const button=document.getElementById("start");
const status=document.getElementById("status");

button.addEventListener("click",async()=>{
 const file=video.files[0];
 const link=url.value.trim();

 if(!file&&!link){
  status.textContent="Please upload a video or paste a link.";
  return;
 }
 if(file&&link){
  status.textContent="Choose either an uploaded video or a link, not both.";
  return;
 }
 if(file&&file.size>50*1024*1024){
  status.textContent="Video is larger than 50 MB.";
  return;
 }
 if(link){
  try{
   const parsed=new URL(link);
   if(parsed.protocol!=="https:"){
    status.textContent="Please use a valid HTTPS link.";
    return;
   }
  }catch{
   status.textContent="Please enter a valid video link.";
   return;
  }
 }

 const data=new FormData();
 if(file)data.append("file",file);
 if(link)data.append("url",link);
 if(focus.value.trim())data.append("focus",focus.value.trim());

 button.disabled=true;
 status.textContent="Processing your video. Please wait...";

 try{
  const response=await fetch(API,{method:"POST",body:data});
  if(!response.ok){
   let message="Request failed ("+response.status+").";
   try{
    const error=await response.json();
    message=error.detail||message;
   }catch{}
   throw new Error(message);
  }

  const blob=await response.blob();
  if(!blob.size)throw new Error("The server returned an empty file.");

  const downloadUrl=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=downloadUrl;
  a.download="CLIP_AI_Highlights.zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(downloadUrl),60000);

  const count=response.headers.get("X-Clip-Count");
  status.textContent="Done! Your ZIP download has started."+
   (count?" Found "+count+" clips.":"");
 }catch(error){
  status.textContent="Error: "+error.message;
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
